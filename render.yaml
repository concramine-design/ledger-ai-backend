# Render "Blueprint" — lets Render auto-configure this service when you connect
# the repo, instead of filling the build/start commands in by hand.
# GEMINI_API_KEY is intentionally NOT set here — you paste it into Render's
# own dashboard (Environment tab) after the service is created, never in this file.
services:
  - type: web
    name: ledger-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
